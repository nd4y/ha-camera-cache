name: Release
on:
  push:
    tags: ['v*']
permissions:
  contents: read
jobs:
  check:
    uses: ./.github/workflows/check.yml
  publish:
    needs: check
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
      - name: Verify version and merged source
        run: |
          python -c 'import json,os; assert os.environ["GITHUB_REF_NAME"]=="v"+json.load(open("custom_components/camera_cache/manifest.json"))["version"]'
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main
      - uses: actions/download-artifact@v8.0.2
        with:
          name: camera-cache-package
          path: release
      - name: Publish verified HACS release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" --verify-tag --title "Camera Cache $GITHUB_REF_NAME" --generate-notes release/*
